services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: blr
      POSTGRES_PASSWORD: blr
      POSTGRES_DB: blr_classical
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blr -d blr_classical"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
