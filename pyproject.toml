[project]
name = "bengaluru-classical"
version = "0.1.0"
description = "Aggregator for hardcore Karnatic and Hindustani classical concerts in Bengaluru"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "pillow>=10.4",
    "icalendar>=6.1",
    "google-cloud-storage>=2.18",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ics>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "google-genai>=0.8",
    "fastmcp>=2.0",
    "starlette>=0.37",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.30",
    "structlog>=24.4",
    "google-cloud-logging>=3.11",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "django-extensions>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"
