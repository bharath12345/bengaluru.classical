{% extends "base.html" %}

{% block title %}Upcoming Concerts — Bengaluru Classical{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <h1 class="text-4xl font-bold mb-6">Upcoming Concerts</h1>

    <form hx-get="{% url 'web:event_list' %}" hx-target="#event-results" hx-swap="outerHTML" hx-trigger="change" class="bg-white rounded-lg shadow p-6 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label for="genre" class="block text-sm font-medium text-gray-700 mb-1">Genre</label>
                <select name="genre" id="genre" class="w-full border-gray-300 rounded-md shadow-sm">
                    <option value="">All</option>
                    <option value="karnatic" {% if filters.genre == "karnatic" %}selected{% endif %}>Karnatic</option>
                    <option value="hindustani" {% if filters.genre == "hindustani" %}selected{% endif %}>Hindustani</option>
                </select>
            </div>
            <div>
                <label for="area" class="block text-sm font-medium text-gray-700 mb-1">Area</label>
                <input type="text" name="area" id="area" value="{{ filters.area }}" placeholder="e.g., Indiranagar" class="w-full border-gray-300 rounded-md shadow-sm">
            </div>
            <div>
                <label for="free" class="block text-sm font-medium text-gray-700 mb-1">Price</label>
                <select name="free" id="free" class="w-full border-gray-300 rounded-md shadow-sm">
                    <option value="">All</option>
                    <option value="true" {% if filters.free == "true" %}selected{% endif %}>Free only</option>
                </select>
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                    Filter
                </button>
            </div>
        </div>
    </form>

    {% include "web/partials/event_list_results.html" %}
</div>
{% endblock %}
